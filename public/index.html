<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Slide Remote</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5722920199902400"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">

  <div style="margin: auto 0; display: flex; flex-direction: column; gap: 0;">

  <div class="logo">
    <span class="logo-icon">📡</span>
    <h1>Slide Remote</h1>
    <p>Controle seus slides de qualquer lugar</p>
  </div>

  <!-- Tela de digitar o codigo -->
  <div class="screen active" id="screen-controller">

    <div id="form-connect" style="display:flex; flex-direction:column; gap:12px;">
      <div class="field">
        <label>Código do computador</label>
        <input type="text" id="code-input" inputmode="numeric" pattern="[0-9]*"
          placeholder="000000" maxlength="6"
          oninput="this.value=this.value.replace(/\D/g,'')">
      </div>
      <div class="err-msg" id="ctrl-err"></div>
      <button class="btn btn-primary" id="btn-conn" onclick="connectAsController()">Conectar</button>
    </div>

    <!-- Controles apos conectar -->
    <div id="nav-controls" style="display:none; flex-direction:column; gap:14px; flex:1;">

      <div class="status">
        <div class="dot on"></div>
        <span>Conectado</span>
      </div>

      <div class="nav-grid">
        <button class="nav-btn" id="btn-prev"
          ontouchstart="press('prev')" ontouchend="release('prev')"
          onmousedown="press('prev')" onmouseup="release('prev')" onmouseleave="release('prev')">
          <div class="nav-arrow">◀</div>
          <div class="nav-text">Anterior</div>
        </button>
        <button class="nav-btn" id="btn-next"
          ontouchstart="press('next')" ontouchend="release('next')"
          onmousedown="press('next')" onmouseup="release('next')" onmouseleave="release('next')">
          <div class="nav-arrow">▶</div>
          <div class="nav-text">Próximo</div>
        </button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="disconnect-wrap" style="margin-top: auto;">
        <div class="divider" style="margin-bottom: 16px;"></div>
        <button class="btn btn-ghost" onclick="disconnectController()">Desconectar</button>
      </div>
    </div>

  </div><!-- fecha screen-controller -->
  </div><!-- fecha margin:auto -->

</div><!-- fecha wrap -->
<script src="js/controller.js"></script>
</body>
</html>
